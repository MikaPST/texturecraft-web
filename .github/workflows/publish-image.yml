name: Build and publish TextureCraft Web

on:
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: "Official upstream release tag (empty = latest)"
        required: false
        type: string
      force_rebuild:
        description: "Rebuild an already published release"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "7 5 * * 1"
  push:
    branches:
      - main
    paths:
      - "README.md"
      - "docker-compose.yml"
      - ".github/workflows/publish-image.yml"

permissions:
  contents: write
  packages: write

env:
  IMAGE_NAME: ghcr.io/mikapst/texturecraft-web

jobs:
  build-and-publish:
    name: Build and publish container image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout packaging repository
        uses: actions/checkout@v4

      - name: Resolve official upstream release
        id: upstream-release
        uses: actions/github-script@v7
        env:
          REQUESTED_TAG: ${{ inputs.upstream_tag }}
        with:
          script: |
            const requested = (process.env.REQUESTED_TAG || '').trim();
            const args = { owner: 'storytold', repo: 'texturecraft' };
            const result = requested
              ? await github.rest.repos.getReleaseByTag({ ...args, tag: requested })
              : await github.rest.repos.getLatestRelease(args);
            const release = result.data;
            if (!release.tag_name) throw new Error('No upstream release tag found');
            core.setOutput('tag', release.tag_name);
            core.setOutput('url', release.html_url);
            core.setOutput('body', release.body || '');
            core.setOutput('prerelease', String(release.prerelease));
            core.setOutput('published_at', release.published_at || '');
            core.setOutput('name', release.name || `texturecraft ${release.tag_name}`);

      - name: Check local release
        id: release-check
        uses: actions/github-script@v7
        env:
          TAG: ${{ steps.upstream-release.outputs.tag }}
          FORCE_REBUILD: ${{ inputs.force_rebuild }}
        with:
          script: |
            let exists = false;
            try {
              await github.rest.repos.getReleaseByTag({ ...context.repo, tag: process.env.TAG });
              exists = true;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const forced = process.env.FORCE_REBUILD === 'true' || context.eventName === 'push';
            core.setOutput('skip', String(exists && !forced));

      - name: Checkout upstream TextureCraft
        if: steps.release-check.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: storytold/texturecraft
          ref: ${{ steps.upstream-release.outputs.tag }}
          path: upstream

      - name: Checkout shared Craft fonts
        if: steps.release-check.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: storytold/craft-fonts
          ref: main
          path: craft-fonts

      - name: Record upstream commit
        if: steps.release-check.outputs.skip != 'true'
        id: upstream
        run: echo "commit=$(git -C upstream rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Record upstream release commit for image tags
        if: steps.release-check.outputs.skip != 'true'
        id: release-source
        shell: bash
        run: |
          echo "short=$(git -C upstream rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        if: steps.release-check.outputs.skip != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96.1"
          targets: wasm32-unknown-unknown

      - name: Verify Rust toolchain
        if: steps.release-check.outputs.skip != 'true'
        run: |
          rustc --version
          cargo --version

      - name: Install Trunk
        if: steps.release-check.outputs.skip != 'true'
        run: cargo install trunk --locked

      - name: Build TextureCraft WebAssembly application
        if: steps.release-check.outputs.skip != 'true'
        working-directory: upstream/apps/texturecraft-web
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
        run: trunk build --release

      - name: Verify generated web application
        if: steps.release-check.outputs.skip != 'true'
        run: |
          test -f upstream/dist/web/index.html
          compgen -G "upstream/dist/web/*.wasm" > /dev/null

      - name: Prepare temporary Docker build context
        if: steps.release-check.outputs.skip != 'true'
        run: |
          mkdir -p docker-context/site
          cp -a upstream/dist/web/. docker-context/site/

          cat > docker-context/Dockerfile <<'EOF'
          FROM nginx:1.27-alpine
          COPY nginx.conf /etc/nginx/conf.d/default.conf
          COPY site/ /usr/share/nginx/html/
          EXPOSE 8080
          EOF

          cat > docker-context/nginx.conf <<'EOF'
          server {
              listen 8080;
              server_name _;
              root /usr/share/nginx/html;
              index index.html;

              include /etc/nginx/mime.types;
              types {
                  application/wasm wasm;
              }

              gzip on;
              gzip_vary on;
              gzip_min_length 1024;
              gzip_types
                  application/javascript
                  application/json
                  application/wasm
                  application/octet-stream
                  text/css
                  text/plain
                  text/xml
                  image/svg+xml;

              location = /index.html {
                  add_header Cache-Control "no-cache, no-store, must-revalidate";
              }

              location / {
                  try_files $uri $uri/ /index.html;
              }

              location ~* [.-][0-9a-f]+\.(js|wasm|css|png|jpg|jpeg|svg|woff2?)$ {
                  add_header Cache-Control "public, max-age=31536000, immutable";
                  try_files $uri =404;
              }
          }
          EOF

      - name: Set up QEMU
        if: steps.release-check.outputs.skip != 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.release-check.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: steps.release-check.outputs.skip != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        if: steps.release-check.outputs.skip != 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.upstream-release.outputs.tag }}
            type=raw,value=upstream-${{ steps.upstream.outputs.commit }}

      - name: Build and push multi-platform image
        if: steps.release-check.outputs.skip != 'true'
        id: build
        uses: docker/build-push-action@v6
        with:
          context: docker-context
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create or update versioned GitHub Release
        if: steps.release-check.outputs.skip != 'true'
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ steps.upstream-release.outputs.tag }}
          RELEASE_NAME: ${{ steps.upstream-release.outputs.name }}
          RELEASE_URL: ${{ steps.upstream-release.outputs.url }}
          RELEASE_NOTES: ${{ steps.upstream-release.outputs.body }}
          RELEASE_PRERELEASE: ${{ steps.upstream-release.outputs.prerelease }}
          RELEASE_PUBLISHED_AT: ${{ steps.upstream-release.outputs.published_at }}
          RELEASE_SOURCE_SHA: ${{ steps.release-source.outputs.short }}
          RELEASE_DIGEST: ${{ steps.build.outputs.digest }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            const image = 'ghcr.io/mikapst/texturecraft-web';
            const body = [
              `Community-maintained Docker packaging for **${process.env.RELEASE_NAME}**.`,
              '',
              '## Docker image',
              `- \`${image}:latest\``,
              `- \`${image}:${tag}\``,
              `- \`${image}:upstream-${process.env.RELEASE_SOURCE_SHA}\``,
              '',
              'Platforms: `linux/amd64`, `linux/arm64`.',
              '',
              `Official upstream release: ${process.env.RELEASE_URL}`,
              `Published upstream: ${process.env.RELEASE_PUBLISHED_AT || 'not specified'}`,
              '',
              `Upstream source commit: \`${process.env.RELEASE_SOURCE_SHA}\``,
              `Docker manifest digest: \`${process.env.RELEASE_DIGEST || 'not reported'}\``,
              '',
              '## Upstream release notes',
              process.env.RELEASE_NOTES || 'No release notes provided upstream.',
              '',
              'This is an independent Docker packaging release, not an official upstream distribution.'
            ].join('\n');
            let existing;
            try {
              existing = (await github.rest.repos.getReleaseByTag({ ...context.repo, tag })).data;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            if (existing) {
              await github.rest.repos.updateRelease({
                ...context.repo, release_id: existing.id, name: 'TextureCraft Web ' + tag,
                body, draft: false, prerelease: process.env.RELEASE_PRERELEASE === 'true'
              });
            } else {
              await github.rest.repos.createRelease({
                ...context.repo, tag_name: tag, target_commitish: context.sha,
                name: 'TextureCraft Web ' + tag, body, draft: false, prerelease: process.env.RELEASE_PRERELEASE === 'true'
              });
            }
