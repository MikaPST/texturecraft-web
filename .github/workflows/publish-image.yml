name: Build and publish TextureCraft Web

on:
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: "Official upstream release tag (empty = latest)"
        required: false
        type: string
      force_rebuild:
        description: "Rebuild an already published release"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "47 3 * * *"
  push:
    branches: [main]
    paths:
      - Dockerfile
      - nginx.conf
      - .dockerignore
      - docker-compose.yml
      - README.md
      - .github/workflows/publish-image.yml

permissions:
  contents: write
  packages: write

env:
  IMAGE_NAME: ghcr.io/mikapst/texturecraft-web

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout packaging repository
        uses: actions/checkout@v4

      - name: Resolve official upstream release
        id: release
        uses: actions/github-script@v7
        env:
          REQUESTED_TAG: ${{ inputs.upstream_tag }}
        with:
          script: |
            const tag = (process.env.REQUESTED_TAG || '').trim();
            const args = {owner: 'storytold', repo: 'texturecraft'};
            const response = tag
              ? await github.rest.repos.getReleaseByTag({...args, tag})
              : await github.rest.repos.getLatestRelease(args);
            const r = response.data;
            core.setOutput('tag', r.tag_name);
            core.setOutput('url', r.html_url);
            core.setOutput('body', r.body || '');
            core.setOutput('prerelease', String(r.prerelease));
            core.setOutput('published_at', r.published_at || '');

      - name: Check existing packaging release
        id: check
        uses: actions/github-script@v7
        env:
          TAG: ${{ steps.release.outputs.tag }}
          FORCE: ${{ inputs.force_rebuild }}
        with:
          script: |
            let exists = false;
            try {
              await github.rest.repos.getReleaseByTag({...context.repo, tag: process.env.TAG});
              exists = true;
            } catch (e) {
              if (e.status !== 404) throw e;
            }
            core.setOutput('skip', String(exists && process.env.FORCE !== 'true' && context.eventName !== 'push'));

      - name: Checkout official TextureCraft source
        if: steps.check.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: storytold/texturecraft
          ref: ${{ steps.release.outputs.tag }}
          path: texturecraft-src

      - name: Checkout optional Craft fonts
        if: steps.check.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: storytold/craft-fonts
          ref: main
          path: craft-fonts

      - name: Record upstream commit
        if: steps.check.outputs.skip != 'true'
        id: source
        shell: bash
        run: echo "short=$(git -C texturecraft-src rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install Rust and WebAssembly target
        if: steps.check.outputs.skip != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Trunk
        if: steps.check.outputs.skip != 'true'
        run: cargo install trunk --locked

      - name: Validate upstream web layout
        if: steps.check.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -f texturecraft-src/Cargo.toml
          test -f texturecraft-src/apps/texturecraft-web/Trunk.toml
          test -f texturecraft-src/apps/texturecraft-web/index.html
          test -f texturecraft-src/LICENSE-MIT
          test -f texturecraft-src/LICENSE-APACHE
          test -f texturecraft-src/NOTICE
          test -f texturecraft-src/ATTRIBUTION.md

      - name: Compile TextureCraft Web
        if: steps.check.outputs.skip != 'true'
        working-directory: texturecraft-src/apps/texturecraft-web
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
        run: trunk build --release

      - name: Prepare Docker build context
        if: steps.check.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -f texturecraft-src/dist/web/index.html
          compgen -G "texturecraft-src/dist/web/*.wasm" >/dev/null
          mkdir -p docker-context/site docker-context/legal
          cp -a texturecraft-src/dist/web/. docker-context/site/
          cp Dockerfile nginx.conf .dockerignore docker-context/
          cp texturecraft-src/LICENSE-MIT texturecraft-src/LICENSE-APACHE \
             texturecraft-src/NOTICE texturecraft-src/ATTRIBUTION.md docker-context/legal/
          if test -f texturecraft-src/README.md; then
            cp texturecraft-src/README.md docker-context/legal/UPSTREAM-README.md
          fi
          for font in inter biz-ud-pgothic noto-sans-cjk-sc; do
            if test -f "craft-fonts/fonts/$font/OFL.txt"; then
              cp "craft-fonts/fonts/$font/OFL.txt" "docker-context/legal/OFL-$font.txt"
            fi
          done
          echo "Using versioned Dockerfile, NGINX config and .dockerignore from this repository."

      - name: Set up QEMU
        if: steps.check.outputs.skip != 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.check.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.check.outputs.skip != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image tags
        if: steps.check.outputs.skip != 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.release.outputs.tag }}
            type=raw,value=upstream-${{ steps.source.outputs.short }}

      - name: Build and push multi-architecture image
        if: steps.check.outputs.skip != 'true'
        id: build
        uses: docker/build-push-action@v6
        with:
          context: docker-context
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish matching GitHub Release
        if: steps.check.outputs.skip != 'true'
        uses: actions/github-script@v7
        env:
          TAG: ${{ steps.release.outputs.tag }}
          UPSTREAM_URL: ${{ steps.release.outputs.url }}
          UPSTREAM_NOTES: ${{ steps.release.outputs.body }}
          UPSTREAM_PRERELEASE: ${{ steps.release.outputs.prerelease }}
          UPSTREAM_DATE: ${{ steps.release.outputs.published_at }}
          UPSTREAM_SHA: ${{ steps.source.outputs.short }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        with:
          script: |
            const tag = process.env.TAG;
            const image = 'ghcr.io/mikapst/texturecraft-web';
            const body = [
              `Community-maintained Docker packaging for TextureCraft ${tag}.`,
              '',
              '## Docker image',
              `- \`${image}:latest\``,
              `- \`${image}:${tag}\``,
              `- \`${image}:upstream-${process.env.UPSTREAM_SHA}\``,
              '',
              'Platforms: `linux/amd64`, `linux/arm64`.',
              `Digest: \`${process.env.IMAGE_DIGEST}\``,
              '',
              `Official upstream release: ${process.env.UPSTREAM_URL}`,
              `Upstream release date: ${process.env.UPSTREAM_DATE || 'unknown'}`,
              '',
              '## Upstream release notes',
              process.env.UPSTREAM_NOTES || 'No notes provided.',
              '',
              'Independent community packaging; not an official ArtCraft release.'
            ].join('\n');
            let existing;
            try {
              existing = (await github.rest.repos.getReleaseByTag({...context.repo, tag})).data;
            } catch (e) {
              if (e.status !== 404) throw e;
            }
            if (existing) {
              await github.rest.repos.updateRelease({
                ...context.repo, release_id: existing.id,
                name: `TextureCraft Web ${tag}`, body,
                draft: false, prerelease: process.env.UPSTREAM_PRERELEASE === 'true'
              });
            } else {
              await github.rest.repos.createRelease({
                ...context.repo, tag_name: tag, target_commitish: context.sha,
                name: `TextureCraft Web ${tag}`, body,
                draft: false, prerelease: process.env.UPSTREAM_PRERELEASE === 'true'
              });
            }
