name: Build and publish TextureCraft Web

on:
  workflow_dispatch:
  schedule:
    - cron: "7 5 * * 1"
  push:
    paths:
      - "README.md"
      - "docker-compose.yml"
      - ".github/workflows/publish-image.yml"

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/texturecraft-web

jobs:
  build-and-publish:
    name: Build and publish container image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout packaging repository
        uses: actions/checkout@v4

      - name: Checkout upstream TextureCraft
        uses: actions/checkout@v4
        with:
          repository: storytold/texturecraft
          ref: main
          path: upstream

      - name: Checkout shared Craft fonts
        uses: actions/checkout@v4
        with:
          repository: storytold/craft-fonts
          ref: main
          path: craft-fonts

      - name: Record upstream commit
        id: upstream
        run: echo "commit=$(git -C upstream rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96.1"
          targets: wasm32-unknown-unknown

      - name: Verify Rust toolchain
        run: |
          rustc --version
          cargo --version

      - name: Install Trunk
        run: cargo install trunk --locked

      - name: Build TextureCraft WebAssembly application
        working-directory: upstream/apps/texturecraft-web
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
        run: trunk build --release

      - name: Verify generated web application
        run: |
          test -f upstream/dist/web/index.html
          compgen -G "upstream/dist/web/*.wasm" > /dev/null

      - name: Prepare temporary Docker build context
        run: |
          mkdir -p docker-context/site
          cp -a upstream/dist/web/. docker-context/site/

          cat > docker-context/Dockerfile <<'EOF'
          FROM nginx:1.27-alpine
          COPY nginx.conf /etc/nginx/conf.d/default.conf
          COPY site/ /usr/share/nginx/html/
          EXPOSE 8080
          EOF

          cat > docker-context/nginx.conf <<'EOF'
          server {
              listen 8080;
              server_name _;
              root /usr/share/nginx/html;
              index index.html;

              include /etc/nginx/mime.types;
              types {
                  application/wasm wasm;
              }

              gzip on;
              gzip_vary on;
              gzip_min_length 1024;
              gzip_types
                  application/javascript
                  application/json
                  application/wasm
                  application/octet-stream
                  text/css
                  text/plain
                  text/xml
                  image/svg+xml;

              location = /index.html {
                  add_header Cache-Control "no-cache, no-store, must-revalidate";
              }

              location / {
                  try_files $uri $uri/ /index.html;
              }

              location ~* [.-][0-9a-f]{16,}\.(js|wasm|css|png|jpg|jpeg|svg|woff2?)$ {
                  add_header Cache-Control "public, max-age=31536000, immutable";
                  try_files $uri =404;
              }
          }
          EOF

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=upstream-${{ steps.upstream.outputs.commit }}

      - name: Build and push multi-platform image
        uses: docker/build-push-action@v6
        with:
          context: docker-context
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
